<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <script>
        (function () {
            try {
                var ua = navigator.userAgent || '';
                var isIPhoneOrIPod = /iPhone|iPod/.test(ua);
                var isAndroidPhone = /Android/i.test(ua) && /Mobile/i.test(ua);
                if (!isIPhoneOrIPod && !isAndroidPhone) return;
                document.documentElement.classList.add('tenant-phone-viewport');
                var m = document.querySelector('meta[name="viewport"]');
                if (!m) return;
                /* Pin scale at 0.85: if max-scale > initial, iOS Safari still zooms focused inputs.
                   minimum/maximum both 0.85 + user-scalable=no stops that (no pinch zoom on phones). */
                m.setAttribute(
                    'content',
                    'width=device-width, initial-scale=0.85, minimum-scale=0.85, maximum-scale=0.85, user-scalable=no'
                );
            } catch (e) {}
        })();
    </script>
    <title>Tenant · Chat</title>
